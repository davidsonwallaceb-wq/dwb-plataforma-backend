
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWB - ELETRO Sistema Completo OFFLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--card:#111827;--border:#1e2535;--gold:#c9a86a;--gold2:#e8c88a;--text:#f5f5f7;--muted:#9aa4bf;--green:#30d158;--red:#ff453a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,Sora,sans-serif;overflow-x:hidden}
.header{position:sticky;top:0;z-index:50;background:rgba(5,7,13,.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:.12em;color:var(--gold2);font-size:16px;font-family:Sora}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:#0f172a;color:var(--muted);cursor:pointer;font-size:12px;font-weight:600}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;font-weight:800}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;padding:10px 18px;border-radius:999px;border:none;font-weight:800;cursor:pointer}
.btn-ghost{background:#1f2a44;color:white;border:1px solid var(--border);padding:8px 14px;border-radius:999px;cursor:pointer;font-size:12px}
.hero{position:relative;margin:20px 24px;border-radius:24px;overflow:hidden;min-height:520px;display:flex;align-items:end;padding:40px;background-size:cover;background-position:center}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,.92) 0%,rgba(5,7,13,.6) 50%,rgba(5,7,13,.15) 100%), linear-gradient(0deg,rgba(5,7,13,.92) 0%,transparent 60%)}
.hero-content{position:relative;z-index:2;max-width:620px}
.hero-badge{background:rgba(201,168,106,.15);border:1px solid rgba(201,168,106,.3);color:var(--gold2);padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;display:inline-block}
.hero h1{font-size:48px;line-height:.95;margin:14px 0;font-weight:900;font-family:Sora}
.hero p{color:#c2cce6;font-size:15px;line-height:1.6;margin-bottom:16px}
.row-section{margin:28px 24px}
.row-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.carousel{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}
.card{flex:0 0 260px;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.3s}
.card:hover{transform:translateY(-4px);border-color:var(--gold2)}
.card-img{height:148px;background-size:cover;background-position:center;position:relative}
.selo{position:absolute;top:8px;left:8px;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800}
.selo.OFERTA{background:#ff3b30;color:white}.selo.NOVO{background:#0a84ff;color:white}.selo.MAIS_VENDIDO{background:var(--gold);color:#111}.selo.EXCLUSIVO{background:#111;color:var(--gold2);border:1px solid var(--gold)}
.card-body{padding:12px}
.card-cat{font-size:9px;color:var(--gold2);letter-spacing:.1em;font-weight:700}
.card-title{font-weight:700;font-size:13px;margin:4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:var(--gold2);font-weight:800;font-size:13px}.price-old{color:var(--muted);text-decoration:line-through;font-size:11px;margin-left:6px}
.panel{margin:20px 24px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form-grid input,.form-grid select,.form-grid textarea{background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:10px;color:white;outline:none}
.form-grid textarea{grid-column:1/-1;min-height:70px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);backdrop-filter:blur(20px);display:none;place-items:center;padding:16px}
.modal.open{display:grid}
.modal-box{width:min(900px,100%);background:#0b0f1c;border:1px solid var(--border);border-radius:20px;overflow:hidden;max-height:90vh;overflow-y:auto}
.modal-hero{height:360px;background-size:cover;background-position:center;position:relative;display:flex;align-items:end;padding:24px}
.modal-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0b0f1c 0%,transparent 60%)}
.modal-content{position:relative;z-index:2}
.link-box{background:#0a0e1a;border:1px dashed #2a5a8a;border-radius:10px;padding:10px;font-family:monospace;color:var(--gold2);word-break:break-all;font-size:12px}
@media(max-width:800px){.hero{margin:12px;min-height:420px;padding:20px}.hero h1{font-size:28px}.row-section{margin:20px 12px}}
</style>
</head>
<body>
<header class="header">
  <div class="logo">DWB PLATAFORMA • ELETRO OFFLINE COMPLETO</div>
  <div class="tabs">
    <button class="tab active" onclick="showTab('vitrine')">Vitrine Netflix</button>
    <button class="tab" onclick="showTab('admin-prod')">Produtos</button>
    <button class="tab" onclick="showTab('admin-afil')">Afiliados</button>
    <button class="tab" onclick="showTab('cadastro')">Cadastro</button>
    <button class="tab" onclick="showTab('dashboard')">Dashboard</button>
    <button class="tab" onclick="showTab('pagamentos')">Pagamentos</button>
    <button class="tab" onclick="showTab('webhooks')">Webhooks</button>
  </div>
  <div style="display:flex;gap:8px"><span id="refBadge" style="font-size:11px;color:#e8c88a;background:rgba(201,168,106,.15);border:1px solid rgba(201,168,106,.3);padding:4px 10px;border-radius:999px;display:none"></span><button class="btn-ghost" onclick="exportAll()">Exportar</button><button class="btn-gold" onclick="resetDemo()">Reset</button></div>
</header>

<div id="tab-vitrine"><section id="hero" class="hero"></section><div id="vitrine"></div></div>
<div id="tab-admin-prod" style="display:none"><div class="panel"><div style="display:flex;justify-content:space-between"><h2>Admin Produtos</h2><button class="btn-gold" onclick="novoProduto()">+ Novo</button></div><div id="formProd" style="margin-top:16px"></div><div id="listaProd" style="margin-top:16px"></div></div></div>
<div id="tab-admin-afil" style="display:none"><div class="panel"><div style="display:flex;justify-content:space-between"><h2>Admin Afiliados</h2><button class="btn-gold" onclick="novoAfiliado()">+ Novo Afiliado</button></div><div id="formAfil" style="margin-top:16px"></div><div id="listaAfil" style="margin-top:16px"></div></div></div>
<div id="tab-cadastro" style="display:none"><div class="panel" style="max-width:600px;margin:20px auto"><h2 style="text-align:center">Seja Afiliado DWB</h2><div class="form-grid" style="grid-template-columns:1fr;margin-top:12px"><input id="cad_nome" placeholder="Nome *"><input id="cad_email" placeholder="Email *"><input id="cad_tel" placeholder="WhatsApp"><input id="cad_pix" placeholder="Chave PIX"><textarea id="cad_sobre" placeholder="Como vai divulgar?"></textarea></div><button class="btn-gold" style="width:100%;margin-top:12px" onclick="cadastrarPublico()">Quero ser Afiliado</button><div id="cadMsg" style="margin-top:12px"></div></div></div>
<div id="tab-dashboard" style="display:none"><div class="panel"><div style="display:flex;gap:12px"><h2>Dashboard Afiliado</h2><select id="selectAfiliadoDash" style="background:#0f172a;border:1px solid #1e2535;border-radius:8px;padding:8px;color:white" onchange="loadDash()"></select><button class="btn-ghost" onclick="copiarLinkGeral()">Copiar link</button></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0" id="dashStats"></div><div id="dashLinks"></div><div id="dashVendas" style="margin-top:16px"></div></div></div>
<div id="tab-pagamentos" style="display:none"><div class="panel"><h2>Pagamentos e Relatórios</h2><div style="display:flex;gap:8px;margin:12px 0"><input type="month" id="pagMes" style="background:#0f172a;border:1px solid #1e2535;border-radius:8px;padding:8px;color:white"><input type="date" id="pagDe"><input type="date" id="pagAte"><button class="btn-gold" onclick="loadPagamentos()">Filtrar</button></div><div id="pagResumo" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"></div><div id="pagLista" style="margin-top:12px"></div><div id="pagVendas" style="margin-top:20px"></div></div></div>
<div id="tab-webhooks" style="display:none"><div class="panel"><h2>Webhooks - Simulação Offline</h2><div class="form-grid" style="margin-top:12px"><select id="wh_produto"></select><input id="wh_valor" type="number" placeholder="Valor"><input id="wh_ref" placeholder="Código afiliado (REF)"><input id="wh_nome" placeholder="Nome cliente"><input id="wh_email" placeholder="Email cliente"></div><button class="btn-gold" style="margin-top:12px" onclick="simularVenda()">Simular Venda → Comissão</button><div id="whMsg" style="margin-top:12px"></div><div style="margin-top:20px;background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:14px"><div style="color:#e8c88a;font-weight:700">URLs para configurar no servidor:</div><div class="link-box" style="margin-top:8px">POST /api/webhooks/kiwify<br>POST /api/webhooks/hotmart<br>POST /api/webhooks/generico</div></div></div></div>
<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()"><div class="modal-box" id="modalBox"></div></div>

<script>
let produtos = [{"id": "prod_001", "nome": "Transformação Emocional 21 Dias", "categoria": "Cursos", "imagem": "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800", "descricaoCurta": "Jornada completa de reprogramação emocional em 21 dias", "descricaoCompleta": "Programa imersivo que une psicanálise, frequência dos nomes e ferramentas práticas para ressignificar padrões emocionais. 21 aulas, workbook e acesso vitalício.", "preco": 297, "precoPromo": 147, "linkCheckout": "https://checkout.dwb.com/transformacao21", "linkProduto": "https://dwb.com/transformacao21", "whatsapp": "5511999990001", "status": "Ativo", "destaque": true, "destaquePrincipal": true, "ordem": 1, "selo": "NOVO", "avaliacao": 4.9, "comissaoAfiliado": 30, "permiteAfiliado": true}, {"id": "prod_002", "nome": "Frequência dos Nomes PRO", "categoria": "Ferramentas", "imagem": "https://images.unsplash.com/photo-1557682224-33bb4a46bbde?w=800", "descricaoCurta": "Ferramenta profissional para decodificação de nomes", "descricaoCompleta": "Software completo com relatórios, mapa de arquétipos e análise vibracional.", "preco": 97, "precoPromo": 49.9, "linkCheckout": "https://checkout.dwb.com/frequencia-pro", "linkProduto": "https://dwb.com/frequencia-pro", "whatsapp": "5511999990001", "status": "Ativo", "destaque": true, "destaquePrincipal": false, "ordem": 2, "selo": "OFERTA", "avaliacao": 4.8, "comissaoAfiliado": 40, "permiteAfiliado": true}, {"id": "prod_003", "nome": "Mentoria Psicanálise Premium", "categoria": "Mentorias", "imagem": "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=800", "descricaoCurta": "Mentoria individual com análise profunda", "descricaoCompleta": "6 encontros individuais + grupo exclusivo + suporte.", "preco": 1997, "precoPromo": 0, "linkCheckout": "#", "linkProduto": "#", "whatsapp": "5511999990001", "status": "Ativo", "destaque": false, "destaquePrincipal": false, "ordem": 3, "selo": "EXCLUSIVO", "avaliacao": 5.0, "comissaoAfiliado": 20, "permiteAfiliado": true}];
let afiliados = JSON.parse(localStorage.getItem('dwb_afiliados')||'[]');
let vendas = JSON.parse(localStorage.getItem('dwb_vendas')||'[]');
let cliques = JSON.parse(localStorage.getItem('dwb_cliques')||'[]');
let REF = new URLSearchParams(window.location.search).get('ref') || localStorage.getItem('dwb_ref');
function save(){localStorage.setItem('dwb_produtos',JSON.stringify(produtos));localStorage.setItem('dwb_afiliados',JSON.stringify(afiliados));localStorage.setItem('dwb_vendas',JSON.stringify(vendas));localStorage.setItem('dwb_cliques',JSON.stringify(cliques));if(REF)localStorage.setItem('dwb_ref',REF);}
if(localStorage.getItem('dwb_produtos')){try{produtos=JSON.parse(localStorage.getItem('dwb_produtos'));}catch(e){}}
if(REF){document.getElementById('refBadge').style.display='inline-block';document.getElementById('refBadge').textContent='REF: '+REF;cliques.push({codigo:REF,data:new Date().toISOString()});save();}
function showTab(t){document.querySelectorAll('[id^=tab-]').forEach(el=>el.style.display='none');document.getElementById('tab-'+t).style.display='block';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');if(t==='vitrine')renderVitrine();if(t==='admin-prod')renderAdminProd();if(t==='admin-afil')renderAdminAfil();if(t==='dashboard')initDash();if(t==='pagamentos')loadPagamentos();if(t==='webhooks')initWebhook();}
function renderVitrine(lista){
  const data=(lista||produtos).filter(p=>p.status==='Ativo');
  const destaque=data.find(p=>p.destaquePrincipal)||data.find(p=>p.destaque)||data[0];
  if(destaque){document.getElementById('hero').style.backgroundImage=`url('${destaque.imagem}')`;document.getElementById('hero').innerHTML=`<div class="hero-content"><div class="hero-badge">${destaque.selo} • EM DESTAQUE</div><h1>${destaque.nome}</h1><p>${destaque.descricaoCurta}</p><button class="btn-gold" onclick="abrirModal('${destaque.id}')">QUERO CONHECER</button></div>`;}
  const cats={};data.forEach(p=>{(cats[p.categoria]=cats[p.categoria]||[]).push(p);});
  const especiais={'EM DESTAQUE':data.filter(p=>p.destaque),'MAIS VENDIDOS':data.filter(p=>p.selo==='MAIS VENDIDO'),'OFERTAS':data.filter(p=>p.selo==='OFERTA'||p.precoPromo>0)};
  let html='';for(const [titulo,items] of Object.entries(especiais)){if(!items.length)continue;html+=secao(titulo,items);}for(const cat of Object.keys(cats)){html+=secao(cat.toUpperCase(),cats[cat]);}document.getElementById('vitrine').innerHTML=html;
}
function secao(titulo,items){const id='car-'+titulo.replace(/\s/g,'');return `<div class="row-section"><div class="row-header"><h2>${titulo}</h2><div style="display:flex;gap:6px"><button class="tab" onclick="document.getElementById('${id}').scrollBy({left:-300,behavior:'smooth'})">‹</button><button class="tab" onclick="document.getElementById('${id}').scrollBy({left:300,behavior:'smooth'})">›</button></div></div><div class="carousel" id="${id}">${items.sort((a,b)=>a.ordem-b.ordem).map(card).join('')}</div></div>`;}
function card(p){const preco=p.precoPromo>0?`<span class="price">R$ ${p.precoPromo}</span><span class="price-old">R$ ${p.preco}</span>`:`<span class="price">R$ ${p.preco}</span>`;return `<div class="card" onclick="abrirModal('${p.id}')"><div class="card-img" style="background-image:url('${p.imagem}')"><div class="selo ${p.selo}">${p.selo!=='NENHUM'?p.selo:''}</div></div><div class="card-body"><div class="card-cat">${p.categoria.toUpperCase()}</div><div class="card-title">${p.nome}</div>${preco}</div></div>`;}
function abrirModal(id){const p=produtos.find(x=>x.id===id);if(!p)return;let checkout=p.linkCheckout;if(REF)checkout+=(checkout.includes('?')?'&':'?')+'ref='+REF;const com=(p.precoPromo||p.preco)*(p.comissaoAfiliado/100);document.getElementById('modalBox').innerHTML=`<div class="modal-hero" style="background-image:url('${p.imagem}')"><div class="modal-content"><div class="hero-badge">${p.categoria} • ${p.selo}</div><h2 style="font-size:32px;margin:8px 0;font-weight:900">${p.nome}</h2><div style="color:#c9a86a">★ ${p.avaliacao} • Afiliado ganha ${p.comissaoAfiliado}% = R$ ${com.toFixed(2)}</div></div></div><div style="padding:20px"><p style="color:#c2cce6">${p.descricaoCompleta}</p><div style="margin:12px 0;color:#e8c88a;font-weight:800">R$ ${p.precoPromo||p.preco}</div><a href="${checkout}" target="_blank" class="btn-gold" style="text-decoration:none" onclick="simularVendaDireta('${p.id}',${p.precoPromo||p.preco})">COMPRAR AGORA</a> <button class="btn-ghost" onclick="fecharModal()">Fechar</button></div>`;document.getElementById('modal').classList.add('open');}
function fecharModal(){document.getElementById('modal').classList.remove('open');}
function simularVendaDireta(prodId,valor){if(!REF)return;const af=afiliados.find(a=>a.codigo===REF);if(!af)return;const p=produtos.find(x=>x.id===prodId);const perc=p.comissaoAfiliado||af.porcentagemPadrao;const com=valor*perc/100;vendas.push({id:'vnd_'+Date.now(),produtoId:prodId,produtoNome:p.nome,afiliadoId:af.id,codigoRef:REF,valor,comissao:com,porcentagem:perc,status:'Pendente',clienteNome:'Cliente Vitrine',data:new Date().toISOString()});af.saldo=(af.saldo||0)+com;af.totalComissoes=(af.totalComissoes||0)+com;save();}
function novoProduto(){document.getElementById('formProd').innerHTML=`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:16px"><div class="form-grid"><input id="fp_nome" placeholder="Nome"><input id="fp_cat" placeholder="Categoria"><input id="fp_img" placeholder="Imagem URL" style="grid-column:1/-1"><input id="fp_preco" type="number" placeholder="Preço"><input id="fp_promo" type="number" placeholder="Promo"><input id="fp_com" type="number" placeholder="% comissão"><select id="fp_selo"><option>NENHUM</option><option>NOVO</option><option>OFERTA</option><option>MAIS VENDIDO</option><option>EXCLUSIVO</option></select><input id="fp_ordem" type="number" placeholder="Ordem"><select id="fp_status"><option>Ativo</option><option>Inativo</option></select><textarea id="fp_curta" placeholder="Descrição curta"></textarea><textarea id="fp_longa" placeholder="Descrição completa"></textarea><input id="fp_checkout" placeholder="Link checkout" style="grid-column:1/-1"></div><div style="margin-top:12px"><button class="btn-gold" onclick="salvarProd('')">Salvar</button> <button class="btn-ghost" onclick="document.getElementById('formProd').innerHTML=''">Cancelar</button></div></div>`;}
function salvarProd(id){const obj={id:id||'prod_'+Date.now(),nome:document.getElementById('fp_nome').value,categoria:document.getElementById('fp_cat').value||'Geral',imagem:document.getElementById('fp_img').value||'https://images.unsplash.com/photo-1557682224-33bb4a46bbde?w=800',descricaoCurta:document.getElementById('fp_curta').value,descricaoCompleta:document.getElementById('fp_longa').value,preco:parseFloat(document.getElementById('fp_preco').value)||0,precoPromo:parseFloat(document.getElementById('fp_promo').value)||0,linkCheckout:document.getElementById('fp_checkout').value||'#',linkProduto:'#',whatsapp:'5511999999999',status:document.getElementById('fp_status').value,destaque:false,destaquePrincipal:false,ordem:parseInt(document.getElementById('fp_ordem').value)||99,selo:document.getElementById('fp_selo').value,avaliacao:4.9,comissaoAfiliado:parseFloat(document.getElementById('fp_com').value)||30,permiteAfiliado:true};if(!obj.nome)return alert('Nome obrigatório');const idx=produtos.findIndex(p=>p.id===obj.id);if(idx>=0)produtos[idx]=obj;else produtos.push(obj);save();document.getElementById('formProd').innerHTML='';renderAdminProd();renderVitrine();}
function renderAdminProd(){document.getElementById('listaProd').innerHTML=produtos.map(p=>`<div style="display:flex;gap:12px;align-items:center;background:#0a0e1a;border:1px solid #1e2535;border-radius:10px;padding:10px;margin-bottom:8px"><img src="${p.imagem}" style="width:48px;height:48px;border-radius:8px;object-fit:cover"><div style="flex:1"><b>${p.nome}</b><div style="font-size:11px;color:#9aa4bf">${p.categoria} • R$ ${p.preco} • ${p.comissaoAfiliado}% • ${p.status}</div></div><button class="btn-ghost" onclick="editarProd('${p.id}')">Editar</button><button class="btn-ghost" style="color:#ff453a" onclick="delProd('${p.id}')">Excluir</button></div>`).join('');}
function editarProd(id){const p=produtos.find(x=>x.id===id);document.getElementById('formProd').innerHTML=`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:16px"><div class="form-grid"><input id="fp_nome" value="${p.nome}"><input id="fp_cat" value="${p.categoria}"><input id="fp_img" value="${p.imagem}" style="grid-column:1/-1"><input id="fp_preco" type="number" value="${p.preco}"><input id="fp_promo" type="number" value="${p.precoPromo}"><input id="fp_com" type="number" value="${p.comissaoAfiliado}"><select id="fp_selo"><option ${p.selo==='NENHUM'?'selected':''}>NENHUM</option><option ${p.selo==='NOVO'?'selected':''}>NOVO</option><option ${p.selo==='OFERTA'?'selected':''}>OFERTA</option><option ${p.selo==='MAIS VENDIDO'?'selected':''}>MAIS VENDIDO</option><option ${p.selo==='EXCLUSIVO'?'selected':''}>EXCLUSIVO</option></select><input id="fp_ordem" type="number" value="${p.ordem}"><select id="fp_status"><option ${p.status==='Ativo'?'selected':''}>Ativo</option><option ${p.status==='Inativo'?'selected':''}>Inativo</option></select><textarea id="fp_curta">${p.descricaoCurta}</textarea><textarea id="fp_longa">${p.descricaoCompleta}</textarea><input id="fp_checkout" value="${p.linkCheckout}" style="grid-column:1/-1"></div><div style="margin-top:12px"><button class="btn-gold" onclick="salvarProd('${p.id}')">Salvar</button> <button class="btn-ghost" onclick="document.getElementById('formProd').innerHTML=''">Cancelar</button></div></div>`;}
function delProd(id){if(confirm('Excluir?')){produtos=produtos.filter(p=>p.id!==id);save();renderAdminProd();renderVitrine();}}
function novoAfiliado(){document.getElementById('formAfil').innerHTML=`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:16px"><div class="form-grid"><input id="fa_nome" placeholder="Nome"><input id="fa_email" placeholder="Email"><input id="fa_tel" placeholder="WhatsApp"><input id="fa_codigo" placeholder="Código auto"><input id="fa_perc" type="number" placeholder="% padrão" value="30"><input id="fa_pix" placeholder="Chave PIX"><select id="fa_status"><option>Ativo</option><option>Pendente</option><option>Inativo</option></select></div><div style="margin-top:12px"><button class="btn-gold" onclick="salvarAfil('')">Salvar</button> <button class="btn-ghost" onclick="document.getElementById('formAfil').innerHTML=''">Cancelar</button></div></div>`;}
function salvarAfil(id){const nome=document.getElementById('fa_nome').value;if(!nome)return alert('Nome obrigatório');const codigo=document.getElementById('fa_codigo').value||nome.substring(0,4).toUpperCase()+Math.random().toString(36).substring(2,6).toUpperCase();const obj={id:id||'afil_'+Date.now(),nome,email:document.getElementById('fa_email').value,telefone:document.getElementById('fa_tel').value,codigo,porcentagemPadrao:parseFloat(document.getElementById('fa_perc').value)||30,chavePix:document.getElementById('fa_pix').value,status:document.getElementById('fa_status').value,saldo:0,totalComissoes:0};const idx=afiliados.findIndex(a=>a.id===obj.id);if(idx>=0){obj.saldo=afiliados[idx].saldo;obj.totalComissoes=afiliados[idx].totalComissoes;afiliados[idx]=obj;}else afiliados.push(obj);save();document.getElementById('formAfil').innerHTML='';renderAdminAfil();initDash();}
function renderAdminAfil(){document.getElementById('listaAfil').innerHTML=afiliados.map(a=>{const link=location.origin+location.pathname+'?ref='+a.codigo;return `<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px"><div><b>${a.nome}</b> <span style="color:#e8c88a;font-size:11px">${a.codigo}</span> <span style="font-size:10px;border:1px solid #1e2535;padding:2px 6px;border-radius:999px">${a.status}</span><div style="font-size:11px;color:#9aa4bf">${a.email} • ${a.porcentagemPadrao}% • Saldo R$ ${(a.saldo||0).toFixed(2)}</div><div class="link-box" style="margin-top:6px">${link}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn-ghost" onclick="editarAfil('${a.id}')">Editar</button><button class="btn-gold" style="padding:6px 12px" onclick="navigator.clipboard.writeText('${link}');alert('Copiado!')">Copiar Link</button><button class="btn-ghost" style="color:#ff453a" onclick="delAfil('${a.id}')">Excluir</button></div></div>`;}).join('')||'<div style="color:#9aa4bf;text-align:center;padding:20px">Nenhum afiliado</div>';}
function editarAfil(id){const a=afiliados.find(x=>x.id===id);document.getElementById('formAfil').innerHTML=`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:16px"><div class="form-grid"><input id="fa_nome" value="${a.nome}"><input id="fa_email" value="${a.email}"><input id="fa_tel" value="${a.telefone}"><input id="fa_codigo" value="${a.codigo}"><input id="fa_perc" type="number" value="${a.porcentagemPadrao}"><input id="fa_pix" value="${a.chavePix}"><select id="fa_status"><option ${a.status==='Ativo'?'selected':''}>Ativo</option><option ${a.status==='Pendente'?'selected':''}>Pendente</option><option ${a.status==='Inativo'?'selected':''}>Inativo</option></select></div><div style="margin-top:12px"><button class="btn-gold" onclick="salvarAfil('${a.id}')">Salvar</button> <button class="btn-ghost" onclick="document.getElementById('formAfil').innerHTML=''">Cancelar</button></div></div>`;}
function delAfil(id){if(confirm('Excluir afiliado?')){afiliados=afiliados.filter(a=>a.id!==id);save();renderAdminAfil();}}
function cadastrarPublico(){const nome=document.getElementById('cad_nome').value,email=document.getElementById('cad_email').value;if(!nome||!email)return alert('Nome e email obrigatórios');const codigo=nome.substring(0,4).toUpperCase()+Math.random().toString(36).substring(2,6).toUpperCase();afiliados.push({id:'afil_'+Date.now(),nome,email,telefone:document.getElementById('cad_tel').value,chavePix:document.getElementById('cad_pix').value,codigo,porcentagemPadrao:30,status:'Pendente',saldo:0,totalComissoes:0,sobre:document.getElementById('cad_sobre').value});save();document.getElementById('cadMsg').innerHTML=`<div style="background:#30d15822;border:1px solid #30d15844;color:#30d158;padding:12px;border-radius:10px">Cadastro recebido! Código: <b>${codigo}</b><br>Link: ${location.origin}${location.pathname}?ref=${codigo}<br>Status: Pendente</div>`;}
function initDash(){const sel=document.getElementById('selectAfiliadoDash');sel.innerHTML=afiliados.map(a=>`<option value="${a.codigo}">${a.nome} (${a.codigo})</option>`).join('');if(afiliados.length)loadDash();}
function loadDash(){const codigo=document.getElementById('selectAfiliadoDash').value||afiliados[0]?.codigo;if(!codigo)return;const af=afiliados.find(a=>a.codigo===codigo);if(!af)return;const vendasAf=vendas.filter(v=>v.codigoRef===codigo);const cliquesAf=cliques.filter(c=>c.codigo===codigo).length;const totalCom=vendasAf.reduce((s,v)=>s+v.comissao,0);document.getElementById('dashStats').innerHTML=`<div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:900;color:#e8c88a">${cliquesAf}</div><div style="font-size:10px;color:#9aa4bf">CLIQUES</div></div><div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:900;color:#30d158">${vendasAf.length}</div><div style="font-size:10px;color:#9aa4bf">VENDAS</div></div><div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:900;color:#e8c88a">R$ ${totalCom.toFixed(2)}</div><div style="font-size:10px;color:#9aa4bf">COMISSÃO</div></div><div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:14px;text-align:center"><div style="font-size:22px;font-weight:900">R$ ${(af.saldo||0).toFixed(2)}</div><div style="font-size:10px;color:#9aa4bf">SALDO</div></div>`;const link=location.origin+location.pathname+'?ref='+codigo;document.getElementById('dashLinks').innerHTML=`<div class="link-box" style="margin:10px 0">${link}</div>`;document.getElementById('dashVendas').innerHTML=vendasAf.map(v=>`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between"><div><b>${v.produtoNome}</b><br><small style="color:#9aa4bf">${new Date(v.data).toLocaleString()}</small></div><div style="color:#30d158;font-weight:700">+ R$ ${v.comissao.toFixed(2)} (${v.porcentagem}%)</div></div>`).join('')||'<div style="color:#9aa4bf">Nenhuma venda</div>';}
function copiarLinkGeral(){const codigo=document.getElementById('selectAfiliadoDash').value;const link=location.origin+location.pathname+'?ref='+codigo;navigator.clipboard.writeText(link);alert('Copiado: '+link);}
function initWebhook(){document.getElementById('wh_produto').innerHTML=produtos.map(p=>`<option value="${p.id}">${p.nome} - R$ ${p.precoPromo||p.preco}</option>`).join('');document.getElementById('wh_valor').value=produtos[0]?(produtos[0].precoPromo||produtos[0].preco):0;}
function simularVenda(){const prodId=document.getElementById('wh_produto').value;const valor=parseFloat(document.getElementById('wh_valor').value)||0;const ref=document.getElementById('wh_ref').value||REF||'';const nome=document.getElementById('wh_nome').value||'Cliente Teste';const p=produtos.find(x=>x.id===prodId);let af=null,perc=0,com=0;if(ref){af=afiliados.find(a=>a.codigo===ref);if(af){perc=p.comissaoAfiliado||af.porcentagemPadrao;com=valor*perc/100;}}vendas.push({id:'vnd_'+Date.now(),produtoId:prodId,produtoNome:p.nome,afiliadoId:af?.id||null,codigoRef:ref,valor,comissao:com,porcentagem:perc,status:'Pendente',clienteNome:nome,data:new Date().toISOString()});if(af){af.saldo=(af.saldo||0)+com;af.totalComissoes=(af.totalComissoes||0)+com;}save();document.getElementById('whMsg').innerHTML=`<div style="background:${com>0?'#30d15822':'#0a0e1a'};border:1px solid ${com>0?'#30d15844':'#1e2535'};padding:12px;border-radius:10px"><b>Venda registrada!</b><br>Produto: ${p.nome}<br>Valor: R$ ${valor}<br>${af?`Afiliado: ${af.nome} (${af.codigo})<br>Comissão: ${perc}% = R$ ${com.toFixed(2)}`:'Venda direta sem afiliado'}</div>`;}
function loadPagamentos(){const mes=document.getElementById('pagMes').value;const de=document.getElementById('pagDe').value;const ate=document.getElementById('pagAte').value;let vendasFiltradas=vendas;if(de&&ate){vendasFiltradas=vendas.filter(v=>{const d=new Date(v.data).toISOString().slice(0,10);return d>=de&&d<=ate;});}if(mes){vendasFiltradas=vendasFiltradas.filter(v=>v.data.slice(0,7)===mes);}const totalV=vendasFiltradas.reduce((s,v)=>s+v.valor,0);const totalC=vendasFiltradas.reduce((s,v)=>s+v.comissao,0);const pago=vendasFiltradas.filter(v=>v.status==='Pago').reduce((s,v)=>s+v.comissao,0);const pend=vendasFiltradas.filter(v=>v.status==='Pendente').reduce((s,v)=>s+v.comissao,0);document.getElementById('pagResumo').innerHTML=`<div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:800">${vendasFiltradas.length}</div><div style="font-size:10px;color:#9aa4bf">VENDAS</div></div><div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:800;color:#e8c88a">R$ ${totalV.toFixed(2)}</div><div style="font-size:10px;color:#9aa4bf">TOTAL</div></div><div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:800;color:#ff9f0a">R$ ${pend.toFixed(2)}</div><div style="font-size:10px;color:#9aa4bf">A PAGAR</div></div><div style="background:#111827;border:1px solid #1e2535;border-radius:12px;padding:12px;text-align:center"><div style="font-size:18px;font-weight:800;color:#30d158">R$ ${pago.toFixed(2)}</div><div style="font-size:10px;color:#9aa4bf">PAGO</div></div>`;const porAfiliado={};vendasFiltradas.filter(v=>v.status==='Pendente'&&v.afiliadoId).forEach(v=>{if(!porAfiliado[v.afiliadoId])porAfiliado[v.afiliadoId]={afiliado:afiliados.find(a=>a.id===v.afiliadoId),vendas:[],total:0};porAfiliado[v.afiliadoId].vendas.push(v);porAfiliado[v.afiliadoId].total+=v.comissao;});document.getElementById('pagLista').innerHTML=Object.values(porAfiliado).map(g=>`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><div><b>${g.afiliado?.nome||'Afiliado'}</b> • ${g.afiliado?.codigo}<br><small style="color:#9aa4bf">${g.afiliado?.email} • PIX: ${g.afiliado?.chavePix||'Não informado'}</small><br><small>${g.vendas.length} vendas • <b style="color:#e8c88a">R$ ${g.total.toFixed(2)}</b></small></div><button class="btn-gold" onclick="pagarAfiliado('${g.afiliado?.id}')">PAGAR R$ ${g.total.toFixed(2)}</button></div>`).join('')||'<div style="color:#9aa4bf;text-align:center;padding:20px">Nenhum pagamento pendente</div>';document.getElementById('pagVendas').innerHTML=vendasFiltradas.map(v=>`<div style="background:#0a0e1a;border:1px solid #1e2535;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;font-size:12px"><div><b>${v.produtoNome}</b> • ${v.clienteNome}<br><small style="color:#9aa4bf">Afiliado: ${v.codigoRef||'Direto'} • ${new Date(v.data).toLocaleString()}</small></div><div style="text-align:right"><div>R$ ${v.valor} → <b style="color:#e8c88a">R$ ${v.comissao.toFixed(2)}</b> (${v.porcentagem}%)</div><span style="font-size:10px;padding:3px 8px;border-radius:999px;background:${v.status==='Pago'?'#30d15822':'#ff9f0a22'};color:${v.status==='Pago'?'#30d158':'#ff9f0a'}">${v.status}</span> ${v.status==='Pendente'?`<button style="margin-left:6px;background:#30d158;color:white;border:none;padding:4px 8px;border-radius:6px;cursor:pointer" onclick="marcarPago('${v.id}')">Pago</button>`:''}</div></div>`).join('');}
function pagarAfiliado(afilId){if(!confirm('Confirmar pagamento? Vai marcar todas vendas pendentes deste afiliado como PAGAS e zerar saldo.'))return;vendas.forEach(v=>{if(v.afiliadoId===afilId&&v.status==='Pendente')v.status='Pago';});const af=afiliados.find(a=>a.id===afilId);if(af)af.saldo=0;save();loadPagamentos();}
function marcarPago(vendaId){const v=vendas.find(x=>x.id===vendaId);if(v){v.status='Pago';const af=afiliados.find(a=>a.id===v.afiliadoId);if(af)af.saldo=Math.max(0,(af.saldo||0)-v.comissao);save();loadPagamentos();}}
function exportAll(){const data={produtos,afiliados,vendas,cliques,exportado:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='dwb_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function resetDemo(){if(confirm('Resetar tudo para demo inicial?')){localStorage.removeItem('dwb_afiliados');localStorage.removeItem('dwb_vendas');localStorage.removeItem('dwb_cliques');localStorage.removeItem('dwb_produtos');location.reload();}}
renderVitrine();renderAdminProd();renderAdminAfil();
</script>
</body>
</html>
