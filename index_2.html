<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DWB Plataforma - Vitrine Netflix</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070d;--card:#111827;--card2:#1a2235;--border:#1e2535;--blue:#1e3a5f;--blue2:#2a5a8a;--gold:#c9a86a;--gold2:#e8c88a;--text:#f5f5f7;--muted:#9aa4bf}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:Inter,Sora,system-ui,sans-serif;overflow-x:hidden}
.glow{position:fixed;pointer-events:none;filter:blur(120px);opacity:.35;z-index:0}
.glow-blue{width:700px;height:700px;background:radial-gradient(circle,var(--blue2),transparent 70%);top:-200px;left:-100px}
.glow-gold{width:600px;height:600px;background:radial-gradient(circle,rgba(201,168,106,.5),transparent 70%);top:200px;right:-150px}
.header{position:sticky;top:0;z-index:50;background:rgba(5,7,13,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:900;letter-spacing:.12em;color:var(--gold2);font-size:20px;font-family:Sora}
.logo span{color:var(--text)}
.nav{display:flex;gap:24px}
.nav a{color:var(--muted);text-decoration:none;font-size:14px}
.nav a:hover{color:var(--text)}
.search{position:relative}
.search input{background:#0f172a;border:1px solid var(--border);border-radius:999px;padding:9px 16px 9px 36px;color:var(--text);width:260px;outline:none}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#111;padding:10px 18px;border-radius:999px;border:none;font-weight:800;cursor:pointer;transition:.2s}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(201,168,106,.3)}
.hero{position:relative;margin:24px 32px;border-radius:24px;overflow:hidden;min-height:560px;display:flex;align-items:end;padding:48px;background-size:cover;background-position:center}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,7,13,.92) 0%,rgba(5,7,13,.6) 50%,rgba(5,7,13,.15) 100%), linear-gradient(0deg,rgba(5,7,13,.92) 0%,transparent 60%)}
.hero-content{position:relative;z-index:2;max-width:620px}
.hero-badge{background:rgba(201,168,106,.15);border:1px solid rgba(201,168,106,.3);color:var(--gold2);padding:6px 12px;border-radius:999px;font-size:11px;letter-spacing:.1em;font-weight:700;display:inline-block}
.hero h1{font-size:54px;line-height:.95;margin:16px 0;font-weight:900;letter-spacing:-.02em;font-family:Sora}
.hero p{color:#c2cce6;font-size:16px;line-height:1.6;margin-bottom:20px}
.row-section{margin:36px 32px}
.row-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.row-header h2{font-size:18px;font-weight:800;letter-spacing:.06em}
.row-arrows{display:flex;gap:8px}
.arrow{width:36px;height:36px;border-radius:50%;background:#111827;border:1px solid var(--border);color:var(--text);cursor:pointer;display:grid;place-items:center;font-size:18px}
.carousel{display:flex;gap:16px;overflow-x:auto;scroll-behavior:smooth;padding-bottom:12px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{flex:0 0 268px;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:.35s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(201,168,106,.45);box-shadow:0 24px 50px rgba(0,0,0,.6),0 0 0 1px rgba(201,168,106,.18)}
.card-img{height:158px;background-size:cover;background-position:center;position:relative}
.card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.65),transparent 60%)}
.selo{position:absolute;top:10px;left:10px;z-index:2;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.selo.OFERTA{background:#ff3b30;color:white}
.selo.NOVO{background:#0a84ff;color:white}
.selo.MAIS_VENDIDO{background:var(--gold);color:#111}
.selo.LANCAMENTO{background:#bf5af2;color:white}
.selo.EXCLUSIVO{background:#111;color:var(--gold2);border:1px solid var(--gold)}
.selo.MAIS\ VENDIDO{background:var(--gold);color:#111}
.card-body{padding:14px}
.card-cat{font-size:10px;color:var(--gold2);letter-spacing:.12em;font-weight:700;margin-bottom:5px}
.card-title{font-weight:700;font-size:14px;line-height:1.3;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-price{display:flex;align-items:center;gap:8px}
.price{color:var(--gold2);font-weight:800;font-size:14px}
.price-old{color:var(--muted);text-decoration:line-through;font-size:12px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.82);backdrop-filter:blur(22px);display:none;place-items:center;padding:20px}
.modal.open{display:grid}
.modal-box{width:min(920px,100%);background:#0b0f1c;border:1px solid var(--border);border-radius:24px;overflow:hidden;max-height:92vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal-hero{height:400px;background-size:cover;background-position:center;position:relative;display:flex;align-items:end;padding:32px}
.modal-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#0b0f1c 0%,rgba(11,15,28,.15) 100%), linear-gradient(90deg,rgba(11,15,28,.9),transparent 65%)}
.modal-content{position:relative;z-index:2;max-width:560px}
.modal-body{padding:28px}
@media(max-width:900px){.hero{margin:12px;border-radius:16px;min-height:460px;padding:24px}.hero h1{font-size:34px}.row-section{margin:24px 16px}.header{padding:12px 16px}.search input{width:160px}}
</style>
</head>
<body>
<div class="glow glow-blue"></div><div class="glow glow-gold"></div>
<header class="header">
  <div class="logo">DWB <span>PLATAFORMA</span></div>
  <nav class="nav"><a href="#">Início</a><a href="#produtos">Produtos</a><a href="quero-ser-afiliado.html">Seja Afiliado</a></nav>
  <div style="display:flex;gap:12px;align-items:center">
    <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="6"/><path d="m21 21-4.3-4.3"/></svg><input id="busca" placeholder="Buscar produtos..." oninput="filtrar()"></div>
    <a href="afiliados.html" class="btn-gold" style="text-decoration:none">ADMIN</a>
  </div>
</header>
<section id="hero" class="hero"></section>
<div id="vitrine"></div>
<div id="modal" class="modal" onclick="if(event.target===this)fecharModal()"><div class="modal-box" id="modalBox"></div></div>
<script>
let produtos=[];let REF=null;
(function(){
  const u=new URLSearchParams(window.location.search);
  const r=u.get('ref');
  if(r){REF=r;localStorage.setItem('dwb_ref',r);fetch('/api/track/clique',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({codigo:r})}).catch(()=>{});}else{REF=localStorage.getItem('dwb_ref');}
})();
async function carregar(){
  try{const r=await fetch('/api/produtos?ativos=1');produtos=await r.json();if(!produtos||produtos.length===0) throw new Error('vazio');}catch(e){const r2=await fetch('products.json');produtos=await r2.json();}
  render();
}
function filtrar(){
  const q=document.getElementById('busca').value.toLowerCase();
  const f=produtos.filter(p=> p.status==='Ativo' && (p.nome.toLowerCase().includes(q) || p.categoria.toLowerCase().includes(q)));
  render(f);
}
function render(lista){
  const data=(lista||produtos).filter(p=>p.status==='Ativo');
  const destaque=data.find(p=>p.destaquePrincipal)||data.find(p=>p.destaque)||data[0];
  if(destaque){
    document.getElementById('hero').style.backgroundImage=`url('${destaque.imagem}')`;
    document.getElementById('hero').innerHTML=`<div class="hero-content"><div class="hero-badge">${destaque.selo} • EM DESTAQUE</div><h1>${destaque.nome}</h1><p>${destaque.descricaoCurta}</p><div style="display:flex;gap:12px;align-items:center;margin-top:8px"><button class="btn-gold" onclick="abrirModal('${destaque.id}')">QUERO CONHECER</button><span style="color:#9aa4bf;font-size:13px">★ ${destaque.avaliacao||4.9} • ACESSO IMEDIATO</span></div></div>`;
  }
  const cats={};data.forEach(p=>{if(!cats[p.categoria]) cats[p.categoria]=[];cats[p.categoria].push(p);});
  const especiais={'EM DESTAQUE':data.filter(p=>p.destaque),'MAIS VENDIDOS':data.filter(p=>p.selo==='MAIS VENDIDO'),'OFERTAS ESPECIAIS':data.filter(p=>p.selo==='OFERTA'||(p.precoPromo&&p.precoPromo>0))};
  let html='';for(const [titulo,items] of Object.entries(especiais)){if(!items.length) continue;html+=secaoHTML(titulo,items);}for(const cat of Object.keys(cats)){html+=secaoHTML(cat.toUpperCase(),cats[cat]);}document.getElementById('vitrine').innerHTML=html;
}
function secaoHTML(titulo,items){
  const id='car-'+titulo.replace(/\s/g,'');
  return `<div class="row-section" id="produtos"><div class="row-header"><h2>${titulo}</h2><div class="row-arrows"><button class="arrow" onclick="document.getElementById('${id}').scrollBy({left:-320,behavior:'smooth'})">‹</button><button class="arrow" onclick="document.getElementById('${id}').scrollBy({left:320,behavior:'smooth'})">›</button></div></div><div class="carousel" id="${id}">${items.sort((a,b)=>a.ordem-b.ordem).map(cardHTML).join('')}</div></div>`;
}
function cardHTML(p){
  const preco=p.precoPromo>0?`<span class="price">R$ ${Number(p.precoPromo).toFixed(2).replace('.',',')}</span><span class="price-old">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</span>`:`<span class="price">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</span>`;
  const seloClass=(p.selo||'NENHUM').replace(' ','_');
  return `<div class="card" onclick="abrirModal('${p.id}')"><div class="card-img" style="background-image:url('${p.imagem}')"><div class="selo ${seloClass}">${p.selo!=='NENHUM'?p.selo:''}</div></div><div class="card-body"><div class="card-cat">${p.categoria.toUpperCase()}</div><div class="card-title">${p.nome}</div><div class="card-price">${preco}</div></div></div>`;
}
function abrirModal(id){
  const p=produtos.find(x=>x.id===id);if(!p) return;
  let checkoutLink=p.linkCheckout||'#';if(REF){checkoutLink+=(checkoutLink.includes('?')?'&':'?')+'ref='+REF;}
  const preco=p.precoPromo>0?`<span style="color:#e8c88a;font-weight:900;font-size:22px">R$ ${Number(p.precoPromo).toFixed(2).replace('.',',')}</span> <span style="text-decoration:line-through;color:#9aa4bf;margin-left:8px">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</span>`:`<span style="color:#e8c88a;font-weight:900;font-size:22px">R$ ${Number(p.preco).toFixed(2).replace('.',',')}</span>`;
  document.getElementById('modalBox').innerHTML=`<div class="modal-hero" style="background-image:url('${p.imagem}')"><div class="modal-content"><div class="hero-badge">${p.categoria} • ${p.selo}</div><h2 style="font-size:36px;margin:10px 0;font-weight:900;font-family:Sora;line-height:1">${p.nome}</h2><div style="color:#c9a86a">★ ${p.avaliacao||4.9} &nbsp; DIGITAL &nbsp; ACESSO IMEDIATO</div></div></div><div class="modal-body"><p style="color:#c2cce6;line-height:1.6;margin-bottom:18px">${p.descricaoCompleta||p.descricaoCurta}</p><div style="margin-bottom:18px">${preco}</div><div style="display:flex;gap:12px;flex-wrap:wrap"><a href="${checkoutLink}" target="_blank" class="btn-gold" style="text-decoration:none" onclick="registrarVenda('${p.id}',${p.precoPromo||p.preco})">COMPRAR AGORA</a><a href="${p.linkProduto||'#'}" target="_blank" style="padding:10px 18px;border-radius:999px;border:1px solid #1f2a44;color:white;text-decoration:none">SAIBA MAIS</a></div><button onclick="fecharModal()" style="margin-top:20px;background:transparent;border:none;color:#9aa4bf;cursor:pointer">Fechar</button></div>`;
  document.getElementById('modal').classList.add('open');
}
function fecharModal(){document.getElementById('modal').classList.remove('open');}
function registrarVenda(produtoId,valor){if(!REF) return;fetch('/api/webhooks/generico',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({produtoId,valor,ref:REF,clienteNome:'Cliente Vitrine'})}).catch(()=>{});}
carregar();
</script>
</body>
</html>
